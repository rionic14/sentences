<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f12">
  <title>문장외우기</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <h1>문장외우기</h1>
      <nav class="nav-actions" aria-label="페이지 메뉴">
        <a class="nav-link" href="/upload.html">업로드</a>
        <a class="nav-link" href="/data.html">데이터 관리</a>
      </nav>
    </header>

    <div class="video-frame" id="videoFrame" hidden>
      <video id="video" playsinline preload="metadata"></video>
      <span class="video-hint">터치하면 처음부터 재생</span>
    </div>

    <section class="sentence-card">
      <p class="sentence empty" id="sentence">불러오는 중…</p>
    </section>

    <section class="stats" id="stats" hidden>
      <div class="stat"><span>목표횟수</span><strong id="targetCount">–</strong></div>
      <div class="stat"><span>현재횟수</span><strong id="currentCount">–</strong></div>
      <div class="stat"><span>시행회차</span><strong id="round">–</strong></div>
    </section>

    <section class="counter" id="counter" hidden>
      <button class="count-button" id="minus" type="button" aria-label="반복횟수 줄이기">−</button>
      <button class="count-button plus" id="plus" type="button" aria-label="반복횟수 늘리기">＋</button>
    </section>

    <p class="message" id="message"></p>
  </main>
  <script type="module" src="/index.js"></script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f12">
  <title>데이터 관리</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app-shell data-shell">
    <header class="topbar"><a class="nav-link" href="/">← 돌아가기</a><h1>데이터 관리</h1></header>
    <section class="bulk-date-control" aria-label="전체 문장 일자 변경">
      <span>전체 일자 변경</span>
      <div class="bulk-date-actions">
        <button type="button" id="bulkDayMinus" aria-label="전체 변경 일수 줄이기">−</button>
        <strong id="bulkDayValue">0일</strong>
        <button type="button" id="bulkDayPlus" aria-label="전체 변경 일수 늘리기">＋</button>
        <button class="bulk-date-apply" type="button" id="bulkDayApply" disabled>적용</button>
      </div>
    </section>
    <p class="message" id="message"></p>
    <section class="data-list" id="dataList"></section>
  </main>

  <dialog id="manageDialog">
    <form class="dialog-form" id="manageForm">
      <textarea id="dialogText" aria-label="문장"></textarea>
      <label class="video-picker" id="videoDropzone">
        <span id="videoPickerLabel">영상 추가 또는 교체</span>
        <input id="dialogVideo" type="file" accept="video/mp4,video/quicktime,video/x-m4v,video/webm">
      </label>
      <div class="round-control">
        <span>현재 회차</span>
        <div class="stepper">
          <button type="button" id="roundMinus" aria-label="회차 줄이기">−</button>
          <strong id="roundValue">1회차</strong>
          <button type="button" id="roundPlus" aria-label="회차 늘리기">＋</button>
        </div>
      </div>
      <div class="round-control">
        <span>현재 반복</span>
        <div class="stepper">
          <button type="button" id="repeatMinus" aria-label="반복 횟수 줄이기">−</button>
          <strong id="repeatValue">0회</strong>
          <button type="button" id="repeatPlus" aria-label="반복 횟수 늘리기">＋</button>
        </div>
      </div>
      <div class="day-control">
        <button type="button" id="dayMinus" aria-label="하루 줄이기">−</button>
        <div class="day-value"><strong id="dayValue">0일</strong><span>남은 일수</span></div>
        <button type="button" id="dayPlus" aria-label="하루 늘리기">＋</button>
      </div>
      <p class="message" id="dialogMeta"></p>
      <div class="dialog-actions">
        <button class="secondary" id="cancelButton" type="button">취소</button>
        <button class="primary" id="manageSaveButton" type="submit">저장</button>
      </div>
      <button class="danger full" id="deleteButton" type="button">문장과 영상 삭제</button>
    </form>
  </dialog>
  <script type="module" src="/data.js"></script>
</body>
</html>
